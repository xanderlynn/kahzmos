name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/SpaceExplorer.sln

      - name: Build
        run: dotnet build src/SpaceExplorer.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/SpaceExplorer.sln --no-build --configuration Release --verbosity normal

      - name: Check formatting
        run: dotnet format src/SpaceExplorer.sln --verify-no-changes --verbosity diagnostic

  validate-arm:
    name: Validate ARM Template
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location ${{ vars.AZURE_LOCATION || 'eastus' }} \
            --output none

      - name: Validate ARM template
        run: |
          az deployment group validate \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/azuredeploy.json \
            --parameters infra/azuredeploy.parameters.json \
            --output table
